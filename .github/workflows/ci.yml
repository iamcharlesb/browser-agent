name: Pilo CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openbuddy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, tests, and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Typecheck, build, security scan, and regression tests
        # Browser interaction tests run against isolated pages, not user accounts.
        run: |
          npx playwright install --with-deps chromium
          npm test
      - name: Verify production TypeScript build
        run: npm run build:production
