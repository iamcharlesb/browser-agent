<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Browser Agent</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a0b;
    --panel: #151517;
    --panel-2: #1b1b1e;
    --border: #272729;
    --text: #f2f2f3;
    --muted: #8c8c92;
    --accent: #3b82f6;
    --accent-strong: #2563eb;
    --ok: #22c55e;
    --fail: #ef4444;
    --warn: #eab308;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  #app {
    max-width: 720px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- shared header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: rgba(10, 10, 11, 0.92);
    backdrop-filter: blur(6px);
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    color: #06060a;
    flex-shrink: 0;
  }
  #bot-name {
    font-size: 15px;
    font-weight: 600;
  }
  #status-pill {
    margin-left: auto;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--panel-2);
    color: var(--muted);
    white-space: nowrap;
  }
  #status-pill.running { background: rgba(59, 130, 246, 0.16); color: var(--accent); }
  #status-pill.success { background: rgba(34, 197, 94, 0.16); color: var(--ok); }
  #status-pill.failure { background: rgba(239, 68, 68, 0.16); color: var(--fail); }
  #new-bot-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 7px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  #new-bot-btn:hover { color: var(--text); border-color: var(--muted); }

  /* ---------- create view ---------- */
  #create-view {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px 60px;
    gap: 22px;
    text-align: center;
  }
  .hero-avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 26px;
    color: #06060a;
  }
  #create-view h1 {
    font-size: 22px;
    margin: 0;
    font-weight: 700;
  }
  #create-view p.sub {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
    max-width: 440px;
  }
  .create-card {
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    text-align: left;
  }
  .field-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
    display: block;
  }
  input[type="text"], textarea {
    width: 100%;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
  }
  input[type="text"]:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  #create-task {
    min-height: 80px;
    resize: vertical;
  }
  details.advanced {
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  details.advanced summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
  }
  .advanced-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
  }
  .advanced-grid label {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .advanced-grid input[type="number"] {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 8px;
  }
  .checkbox-row {
    grid-column: span 2;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }

  .session-strip {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(59, 130, 246, 0.08);
    border: 1px solid rgba(59, 130, 246, 0.25);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12px;
  }
  .session-strip span#session-status-text { color: var(--muted); flex: 1; }
  .session-strip.open span#session-status-text { color: var(--ok); }
  .session-strip button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .session-strip button:disabled { opacity: 0.5; cursor: not-allowed; }

  button.primary {
    background: var(--accent);
    color: #06060a;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  button.primary:hover { background: var(--accent-strong); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }

  #create-error {
    display: none;
    font-size: 12px;
    color: var(--fail);
    text-align: left;
  }

  /* ---------- chat view ---------- */
  #chat-view {
    display: none;
    flex: 1;
    flex-direction: column;
    min-height: 0;
  }
  #chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 10px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .bubble-row { display: flex; gap: 10px; align-items: flex-start; }
  .bubble-row.user { flex-direction: row-reverse; }
  .bubble-avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
  }
  .bubble-row.user .bubble-avatar { background: var(--panel-2); color: var(--muted); }
  .bubble-row.bot .bubble-avatar { background: linear-gradient(135deg, var(--accent), #8b5cf6); color: #06060a; }
  .bubble {
    max-width: 78%;
    padding: 10px 13px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.45;
  }
  .bubble-row.user .bubble { background: var(--accent); color: #06060a; border-radius: 14px 14px 4px 14px; }
  .bubble-row.bot .bubble { background: var(--panel); border: 1px solid var(--border); border-radius: 14px 14px 14px 4px; }
  .bubble.fail { border-color: rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.07); }
  .bubble.terminal.success { border-color: rgba(34, 197, 94, 0.4); background: rgba(34, 197, 94, 0.08); }
  .bubble.terminal.failure { border-color: rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.08); }
  .bubble.verify { border-color: rgba(234, 179, 8, 0.45); background: rgba(234, 179, 8, 0.08); }
  .bubble .step-meta { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .bubble .warning-line, .bubble .directive-line { color: var(--warn); margin-top: 6px; font-size: 12.5px; }
  .bubble a.thumb-link { display: inline-block; margin-top: 8px; }
  .bubble a.thumb-link img {
    max-width: 220px;
    max-height: 140px;
    border-radius: 8px;
    border: 1px solid var(--border);
    display: block;
  }
  .bubble button.resume-btn {
    margin-top: 8px;
    background: var(--warn);
    color: #1a1400;
    border: none;
    border-radius: 7px;
    padding: 7px 12px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }

  #composer {
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--bg);
  }
  #composer textarea {
    flex: 1;
    min-height: 44px;
    max-height: 140px;
    resize: vertical;
  }
  #composer button {
    background: var(--accent);
    color: #06060a;
    border: none;
    border-radius: 10px;
    padding: 11px 16px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  #composer button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="avatar" id="header-avatar">B</div>
    <span id="bot-name">Browser Agent</span>
    <span id="status-pill">idle</span>
    <button id="new-bot-btn" style="display:none;">New bot</button>
  </header>

  <section id="create-view">
    <div class="hero-avatar" id="hero-avatar">B</div>
    <h1>Create a bot</h1>
    <p class="sub">Name it, tell it what to do first, and it'll go drive a real browser to get it done &mdash; screenshots and all, step by step.</p>

    <div class="create-card">
      <div>
        <span class="field-label">Bot name</span>
        <input type="text" id="bot-name-input" placeholder="Browser Agent" />
      </div>
      <div>
        <span class="field-label">First instruction</span>
        <textarea id="create-task" placeholder="e.g. Go to duckduckgo.com and search for 'dress'"></textarea>
      </div>

      <div class="session-strip" id="session-strip">
        <span id="session-status-text">no saved login session yet</span>
        <button id="session-open-btn">Set up login</button>
        <button id="session-close-btn" disabled>Done &amp; save</button>
      </div>

      <details class="advanced">
        <summary>Advanced settings</summary>
        <div class="advanced-grid">
          <label>Max steps
            <input type="number" id="max-steps" value="20" min="1" max="100" />
          </label>
          <label>Timeout (s)
            <input type="number" id="max-duration" value="900" min="10" max="3600" />
          </label>
          <div class="checkbox-row">
            <input type="checkbox" id="headless" /> <label for="headless">run headless (no visible window)</label>
          </div>
        </div>
      </details>

      <div id="create-error"></div>
      <button class="primary" id="create-btn">Create bot &amp; run</button>
    </div>
  </section>

  <section id="chat-view">
    <div id="chat-log"></div>
    <div id="composer">
      <textarea id="followup-task" placeholder="Instruct your bot..."></textarea>
      <button id="followup-send-btn">Send</button>
    </div>
  </section>
</div>

<script>
(function () {
  const createView = document.getElementById("create-view");
  const chatView = document.getElementById("chat-view");
  const botNameInput = document.getElementById("bot-name-input");
  const createTaskEl = document.getElementById("create-task");
  const createBtn = document.getElementById("create-btn");
  const createErrorEl = document.getElementById("create-error");
  const headlessEl = document.getElementById("headless");
  const maxStepsEl = document.getElementById("max-steps");
  const maxDurationEl = document.getElementById("max-duration");
  const sessionStrip = document.getElementById("session-strip");
  const sessionStatusText = document.getElementById("session-status-text");
  const sessionOpenBtn = document.getElementById("session-open-btn");
  const sessionCloseBtn = document.getElementById("session-close-btn");

  const headerAvatar = document.getElementById("header-avatar");
  const heroAvatar = document.getElementById("hero-avatar");
  const botNameLabel = document.getElementById("bot-name");
  const statusPill = document.getElementById("status-pill");
  const newBotBtn = document.getElementById("new-bot-btn");
  const chatLog = document.getElementById("chat-log");
  const followupTaskEl = document.getElementById("followup-task");
  const followupSendBtn = document.getElementById("followup-send-btn");

  let eventSource = null;
  let isRunning = false;
  let botName = "Browser Agent";

  function initials(name) {
    const trimmed = (name || "B").trim();
    if (!trimmed) return "B";
    const parts = trimmed.split(/\s+/).slice(0, 2);
    return parts.map((p) => p[0].toUpperCase()).join("");
  }

  function setBotName(name) {
    botName = name && name.trim() ? name.trim() : "Browser Agent";
    botNameLabel.textContent = botName;
    headerAvatar.textContent = initials(botName);
    heroAvatar.textContent = initials(botName);
  }

  function setStatus(label, cls) {
    statusPill.textContent = label;
    statusPill.className = cls || "";
  }

  function scrollChatToBottom() {
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text == null ? "" : String(text);
    return div.innerHTML;
  }

  function addBubble(role, innerHtml, extraClass) {
    const row = document.createElement("div");
    row.className = "bubble-row " + role;
    const avatar = document.createElement("div");
    avatar.className = "bubble-avatar";
    avatar.textContent = role === "user" ? "you" : initials(botName).slice(0, 1);
    const bubble = document.createElement("div");
    bubble.className = "bubble " + (extraClass || "");
    bubble.innerHTML = innerHtml;
    row.appendChild(avatar);
    row.appendChild(bubble);
    chatLog.appendChild(row);
    scrollChatToBottom();
    return bubble;
  }

  function thumbHtml(screenshotB64) {
    if (!screenshotB64) return "";
    const dataUrl = "data:image/png;base64," + screenshotB64;
    return '<a class="thumb-link" href="' + dataUrl + '" target="_blank" rel="noopener"><img src="' + dataUrl + '" alt="screenshot" /></a>';
  }

  function describeStep(event) {
    const toolLabels = {
      navigate: "Navigating",
      click_coords: "Clicking",
      type_text: "Typing",
      scroll_page: "Scrolling",
      key_press: "Pressing a key",
      wait: "Waiting"
    };
    const label = toolLabels[event.toolName] || event.toolName;
    return label + " &mdash; " + escapeHtml(event.message);
  }

  function handleEvent(event) {
    if (event.type === "observe") {
      addBubble(
        "bot",
        '<div class="step-meta">looking at the page</div>' + escapeHtml(event.title || event.url) + thumbHtml(event.screenshotB64),
        "ok"
      );
      return;
    }
    if (event.type === "step") {
      let html = '<div class="step-meta">step ' + event.step + "</div>" + describeStep(event);
      if (event.warning) html += '<div class="warning-line">' + escapeHtml(event.warning) + "</div>";
      if (event.directive) html += '<div class="directive-line">' + escapeHtml(event.directive) + "</div>";
      html += thumbHtml(event.screenshotB64);
      addBubble("bot", html, event.ok ? "" : "fail");
      return;
    }
    if (event.type === "human_verification") {
      const html =
        '<div class="step-meta">needs you</div>' +
        escapeHtml(event.message || "Sign-in or verification needed.") +
        thumbHtml(event.screenshotB64) +
        '<br/><button class="resume-btn" id="inline-resume-btn">I\'ve handled it &mdash; Resume</button>';
      addBubble("bot", html, "verify");
      document.getElementById("inline-resume-btn").addEventListener("click", resumeRun);
      return;
    }
    if (event.type === "human_verification_resolved") {
      addBubble("bot", '<div class="step-meta">resolved</div>Continuing...' + thumbHtml(event.screenshotB64), "ok");
      return;
    }
    if (event.type === "terminal") {
      const label = event.success ? "Done" : "Couldn't finish";
      const cls = event.success ? "terminal success" : "terminal failure";
      addBubble(
        "bot",
        "<strong>" + label + "</strong> &mdash; " + escapeHtml(event.summary) +
          '<div class="step-meta" style="margin-top:6px;">' +
          escapeHtml(event.terminationReason) + " · " + event.stepsTaken + " steps · " +
          event.elapsedSeconds.toFixed(1) + "s</div>",
        cls
      );
      setStatus(event.success ? "done" : "failed", event.success ? "success" : "failure");
      isRunning = false;
      followupSendBtn.disabled = false;
      if (eventSource) {
        eventSource.close();
        eventSource = null;
      }
    }
  }

  async function startBotRun(task, headless, maxSteps, maxDurationSeconds) {
    isRunning = true;
    setStatus("running", "running");
    let response;
    try {
      response = await fetch("/api/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ task, headless, maxSteps, maxDurationSeconds }),
      });
    } catch (err) {
      addBubble("bot", "Could not reach the agent server: " + escapeHtml(String(err)), "fail");
      setStatus("idle", "");
      isRunning = false;
      followupSendBtn.disabled = false;
      return false;
    }
    if (!response.ok) {
      const body = await response.json().catch(() => ({ detail: response.statusText }));
      addBubble("bot", escapeHtml(body.detail || "Failed to start the run."), "fail");
      setStatus("idle", "");
      isRunning = false;
      followupSendBtn.disabled = false;
      return false;
    }

    eventSource = new EventSource("/api/events");
    eventSource.onmessage = function (msg) {
      try {
        handleEvent(JSON.parse(msg.data));
      } catch (err) {
        console.error("Failed to parse event", err, msg.data);
      }
    };
    eventSource.onerror = function () {
      if (eventSource) {
        eventSource.close();
        eventSource = null;
      }
      isRunning = false;
      followupSendBtn.disabled = false;
    };
    return true;
  }

  async function resumeRun() {
    try {
      const response = await fetch("/api/resume", { method: "POST" });
      if (!response.ok) {
        const body = await response.json().catch(() => ({ detail: response.statusText }));
        addBubble("bot", escapeHtml(body.detail || "Failed to resume."), "fail");
      }
    } catch (err) {
      addBubble("bot", "Could not reach the agent server: " + escapeHtml(String(err)), "fail");
    }
  }

  async function createBot() {
    const task = createTaskEl.value.trim();
    createErrorEl.style.display = "none";
    if (!task) {
      createErrorEl.textContent = "Give your bot a first instruction.";
      createErrorEl.style.display = "block";
      return;
    }
    setBotName(botNameInput.value);
    createBtn.disabled = true;

    createView.style.display = "none";
    chatView.style.display = "flex";
    newBotBtn.style.display = "inline-block";

    addBubble("user", escapeHtml(task));
    const headless = headlessEl.checked;
    const maxSteps = parseInt(maxStepsEl.value, 10) || 20;
    const maxDurationSeconds = parseFloat(maxDurationEl.value) || 900;
    followupSendBtn.disabled = true;
    await startBotRun(task, headless, maxSteps, maxDurationSeconds);
    createBtn.disabled = false;
  }

  async function sendFollowup() {
    const task = followupTaskEl.value.trim();
    if (!task || isRunning) return;
    addBubble("user", escapeHtml(task));
    followupTaskEl.value = "";
    followupSendBtn.disabled = true;
    setStatus("running", "running");
    await startBotRun(task, headlessEl.checked, parseInt(maxStepsEl.value, 10) || 20, parseFloat(maxDurationEl.value) || 900);
  }

  function resetToCreateView() {
    if (eventSource) {
      eventSource.close();
      eventSource = null;
    }
    isRunning = false;
    chatLog.innerHTML = "";
    chatView.style.display = "none";
    createView.style.display = "flex";
    newBotBtn.style.display = "none";
    setStatus("idle", "");
  }

  async function openLoginSession() {
    sessionOpenBtn.disabled = true;
    try {
      const response = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: "about:blank" }),
      });
      if (!response.ok) {
        const body = await response.json().catch(() => ({ detail: response.statusText }));
        createErrorEl.textContent = body.detail || "Failed to open a login session.";
        createErrorEl.style.display = "block";
        sessionOpenBtn.disabled = false;
        return;
      }
      sessionStatusText.textContent = "browser window open — sign in, then click “Done & save”";
      sessionStrip.classList.add("open");
      sessionCloseBtn.disabled = false;
    } catch (err) {
      createErrorEl.textContent = "Could not reach the agent server: " + err;
      createErrorEl.style.display = "block";
      sessionOpenBtn.disabled = false;
    }
  }

  async function closeLoginSession() {
    sessionCloseBtn.disabled = true;
    try {
      const response = await fetch("/api/login/close", { method: "POST" });
      if (!response.ok) {
        const body = await response.json().catch(() => ({ detail: response.statusText }));
        createErrorEl.textContent = body.detail || "Failed to close the login session.";
        createErrorEl.style.display = "block";
        sessionCloseBtn.disabled = false;
        return;
      }
      sessionStatusText.textContent = "session saved — later runs reuse it";
      sessionStrip.classList.remove("open");
      sessionOpenBtn.disabled = false;
    } catch (err) {
      createErrorEl.textContent = "Could not reach the agent server: " + err;
      createErrorEl.style.display = "block";
      sessionCloseBtn.disabled = false;
    }
  }

  createBtn.addEventListener("click", createBot);
  newBotBtn.addEventListener("click", resetToCreateView);
  sessionOpenBtn.addEventListener("click", openLoginSession);
  sessionCloseBtn.addEventListener("click", closeLoginSession);
  followupSendBtn.addEventListener("click", sendFollowup);
  createTaskEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) createBot();
  });
  followupTaskEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) sendFollowup();
  });
})();
</script>
</body>
</html>
